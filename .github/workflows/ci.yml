name: Swift package and iOS demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Test core and build adapters
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build iOS demo
        run: >-
          xcodebuild
          -project Examples/ParallaxKitDemo/ParallaxKitDemo.xcodeproj
          -scheme ParallaxKitDemo
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/ParallaxKitDemo"
          CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build
      - name: Build Simulator demo
        run: >-
          xcodebuild
          -project Examples/ParallaxKitDemo/ParallaxKitDemo.xcodeproj
          -scheme ParallaxKitDemo
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/ParallaxKitDemo"
          CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build
